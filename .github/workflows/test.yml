name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -x lethe.sh test/mocks/* test/test_helper.bash test/ci/*.sh
          shellcheck -x --shell=bats test/*.bats

  bats:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run tests
        run: bats --print-output-on-failure test/

  # The tests and the install commands lethe.sh suggests, on each supported
  # Linux family (fresh containers, so the install commands start from zero)
  linux:
    name: linux (${{ matrix.image }})
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: [debian:12, ubuntu:24.04, fedora:42, oraclelinux:9, rockylinux:9, archlinux:latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install commands from lethe.sh
        run: bash test/ci/check-install-hints.sh
      - name: Install test dependencies
        run: sh test/ci/install-test-deps.sh
      - name: Run tests
        run: bats --print-output-on-failure test/
